services:
  db:
    image: postgres:15-alpine
    container_name: springroll_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: springroll_db
      POSTGRES_USER: postgres
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d springroll_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: springroll_backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8000

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: springroll_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
