services:
  - type: web
    name: springroll-backend
    env: node
    plan: free
    region: singapore
    # ใช้ npm ci พร้อมตัด devDependencies เพื่อให้ Build ไวและไฟล์เล็กลง
    buildCommand: npm ci --omit=dev
    # รันตรงไปยังไฟล์เริ่มต้น เพื่อลด memory overhead ของ npm บน Free Tier (512MB)
    startCommand: node server.js
    # ตรวจสอบ Health Check endpoint
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INIT_USERNAME
        sync: false
      - key: ADMIN_INIT_PASSWORD
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_CANCEL_WEBHOOK_URL
        sync: false
      - key: DISCORD_REPORT_WEBHOOK_URL
        sync: false
