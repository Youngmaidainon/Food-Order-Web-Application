upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'";

    # Gzip configuration
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Dynamic SPA HTML entry - fresh navigation
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Static Assets & Media: Full Cloudflare Edge CDN & Browser Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|eot|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "max-age=31536000";
        add_header CDN-Cache-Control "max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # REST API Location (Smart Polling & Conditional Requests / ETag)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass conditional headers for ETag / 304 Smart Cache
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;

        # REST API Timeouts & Buffering
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
    }
}

